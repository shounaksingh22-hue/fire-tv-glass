plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivantrj.glasslauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ivantrj.glasslauncher'
        minSdk 28          // Fire OS 7 (Android 9 / API 28) and Fire OS 8 (API 30)
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.zxing:core:3.5.3' // QR codes for the phone remote and the TV guide
}
